name: retired

# 这个仓库已停用，站点已迁移到 https://opengeo.page
# 对应仓库：315fang/OpenGEO-Hugo
#
# 原来的 job 会把 dist/ rsync 到 /var/www/opengeo/，而那是 Hugo 站点的根目录，
# 一旦运行会覆盖线上博客。现在改为仅手动触发，且只打印提示，不再部署。

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: |
          echo "This project is retired."
          echo "Live site: https://opengeo.page (315fang/OpenGEO-Hugo)"
          echo "No deployment is performed by this workflow."
